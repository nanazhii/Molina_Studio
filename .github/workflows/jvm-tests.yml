name: Uji JVM
# Hanya manual (workflow_dispatch). Menjalankan unit test modul lewat Gradle.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 8.10.2
      - name: Gerbang batas modul
        if: hashFiles('scripts/module_gate.py') != ''
        run: python3 scripts/module_gate.py
      - name: Uji unit modul
        run: gradle :core-common:testDebugUnitTest :core-storage:testDebugUnitTest :core-log:testDebugUnitTest :terminal-core:testDebugUnitTest :mpv-native:testDebugUnitTest :files:testDebugUnitTest --stacktrace
