name: Uji JVM
# Hanya manual (workflow_dispatch). Menjalankan unit test modul lewat Gradle.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Uji unit modul
        run: gradle :core-log:testDebugUnitTest :terminal-core:testDebugUnitTest --stacktrace
