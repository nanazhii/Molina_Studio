name: Uji JVM
# Hanya manual (workflow_dispatch). Menjalankan unit test modul lewat Gradle.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Uji unit modul
        run: gradle :core-common:testDebugUnitTest :core-storage:testDebugUnitTest :core-log:testDebugUnitTest :terminal-core:testDebugUnitTest :mpv-native:testDebugUnitTest :files:testDebugUnitTest --stacktrace
