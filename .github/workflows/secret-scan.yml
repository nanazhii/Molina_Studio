name: Pemindai rahasia

# Selalu jalan untuk push dan PR (termasuk perubahan dokumen) dan tidak memakai secret apa pun.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gerbang rahasia (berkas ter-track)
        run: python3 scripts/secret_gate.py
      - name: Gerbang rahasia (seluruh riwayat)
        run: python3 scripts/secret_gate.py --history
