name: Verifikasi Gradle (buat metadata)

# Manual: membuat gradle/verification-metadata.xml (hash SHA-256 tiap dependensi dan plugin).
# Unduh artefaknya, taruh di gradle/verification-metadata.xml, commit. Setelah itu Gradle
# menolak dependensi yang hash-nya berubah (anti supply chain). Tidak memengaruhi build.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 8.10.2
      - name: Pustaka native mpv (terverifikasi SHA-256)
        if: hashFiles('scripts/fetch_native.sh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_native.sh
      - name: Pastikan NDK sesuai pin
        if: hashFiles('scripts/ensure_ndk.sh') != ''
        run: bash scripts/ensure_ndk.sh
      - name: Tulis metadata verifikasi
        run: gradle --write-verification-metadata sha256 :app:assembleRelease --stacktrace
      - name: Pastikan metadata terbentuk
        run: test -s gradle/verification-metadata.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-verification-metadata
          path: gradle/verification-metadata.xml
