name: Vault bunker
# [VAULT-OFF] Nonaktif otomatis; hanya bisa dijalankan manual (workflow_dispatch).
on:
  workflow_dispatch:
concurrency:
  group: vault-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/telemetry_gate.py
      - run: python3 scripts/secret_gate.py
      - run: python3 scripts/bundle_gate.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Siapkan kunci tanda tangan tetap
        env:
          MOLINA_KEYSTORE_B64: ${{ secrets.MOLINA_KEYSTORE_B64 }}
          MOLINA_KEYSTORE_PASSWORD: ${{ secrets.MOLINA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MOLINA_KEYSTORE_B64" ] && [ -n "$MOLINA_KEYSTORE_PASSWORD" ]; then
            ( umask 077; printf %s "$MOLINA_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/molina.p12" )
            echo "MOLINA_KEYSTORE_FILE=$RUNNER_TEMP/molina.p12" >> "$GITHUB_ENV"
            echo "Kunci tetap dipakai."
          else
            echo "::warning::Secret kunci belum diisi; memakai keystore debug acak (update antar build akan gagal)."
          fi
      - name: Pastikan NDK sesuai pin
        run: bash scripts/ensure_ndk.sh
      - name: Build Vault release (R8)
        env:
          MOLINA_KEYSTORE_PASSWORD: ${{ secrets.MOLINA_KEYSTORE_PASSWORD }}
        run: gradle :vault:assembleRelease --stacktrace
      - name: Verifikasi bunker
        run: |
          shopt -s nullglob
          apks=(vault/build/outputs/apk/release/*.apk)
          [ "${#apks[@]}" -gt 0 ] || { echo "::error::APK Vault tidak ditemukan"; exit 1; }
          for f in "${apks[@]}"; do bash scripts/verify-bunker.sh "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: molina-vault
          path: vault/build/outputs/apk/release/*.apk
      - name: Hapus kunci sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/molina.p12"
