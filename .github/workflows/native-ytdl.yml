name: Native ytdl (arm64)

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Abaikan cache dan bangun ulang dari nol"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prasyarat skrip dan pin
        run: |
          set -euo pipefail
          for f in scripts/native_ytdl.sh scripts/native_wget.sh scripts/ensure_ndk.sh \
                   native/pins.env native/pins.sha256 native/ytdl.pins.env; do
            [ -s "$f" ] || { echo "::error::$f tidak ada atau kosong"; exit 1; }
          done
          grep -E '^(CPYTHON|QJS)_SHA=' native/ytdl.pins.env | grep -Ev '=[0-9a-f]{40}$' \
            && { echo "::error::SHA git di ytdl.pins.env tidak valid"; exit 1; } || true
          grep -E '^YTDLP_SHA256=' native/ytdl.pins.env | grep -Ev '=[0-9a-f]{64}$' \
            && { echo "::error::YTDLP_SHA256 tidak valid"; exit 1; } || true
          grep -Ev '^[0-9a-f]{64}  https:[/][/][^ ]+$' native/pins.sha256 \
            && { echo "::error::format pins.sha256 tidak valid"; exit 1; } || true
      - name: Cache hasil build (kunci = hash pin + skrip build)
        id: cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _ytdl_out
          key: native-ytdl-arm64-v1-${{ runner.os }}-${{ hashFiles('native/pins.env', 'native/pins.sha256', 'native/ytdl.pins.env', 'scripts/native_ytdl.sh', 'scripts/native_wget.sh', 'scripts/ensure_ndk.sh') }}
      - name: Verifikasi hasil cache
        id: verify
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          ok=false
          if [ "$CACHE_HIT" = "true" ]; then
            if ( cd _ytdl_out && test -s molina-ytdl-arm64.tgz && test -s yt-dlp && test -s qjs && test -s BUILD-INFO.txt && sha256sum -c SHA256SUMS ); then
              ok=true
              echo "Cache cocok dan utuh: build dilewati."
            else
              echo "::warning::Cache rusak atau tidak lengkap; build ulang."
              rm -rf _ytdl_out
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Paket build host (Python x86_64 untuk android.py) dan cmake
        if: steps.verify.outputs.ok != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config cmake zlib1g-dev libssl-dev libffi-dev \
            libbz2-dev liblzma-dev libsqlite3-dev libzstd-dev
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Bangun runtime yt-dlp (CPython bionic, quickjs-ng, zipapp)
        if: steps.verify.outputs.ok != 'true'
        run: bash scripts/native_ytdl.sh
      - name: Ringkasan hash
        if: success()
        run: |
          {
            echo '### SHA256SUMS'; echo '```'; cat _ytdl_out/SHA256SUMS; echo '```'
            echo '### BUILD-INFO'; echo '```'; cat _ytdl_out/BUILD-INFO.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: molina-ytdl-arm64
          path: |
            _ytdl_out/molina-ytdl-arm64.tgz
            _ytdl_out/yt-dlp
            _ytdl_out/qjs
            _ytdl_out/SHA256SUMS
            _ytdl_out/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: molina-ytdl-arm64
          path: _dl
      - name: Terbitkan ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _dl
          TAG="native-ytdl-${GITHUB_SHA:0:7}-run${GITHUB_RUN_NUMBER}"
          SUM="$(sha256sum molina-ytdl-arm64.tgz | cut -d' ' -f1)"
          grep -q "$SUM  molina-ytdl-arm64.tgz" SHA256SUMS
          SIZE="$(stat -c%s molina-ytdl-arm64.tgz)"
          gh release create "$TAG" molina-ytdl-arm64.tgz SHA256SUMS BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "ytdl runtime arm64 $TAG" \
            --notes "Runtime yt-dlp arm64 (CPython bionic, quickjs-ng, zipapp yt-dlp) hasil build pipeline Molina; sumber dan commit tercatat di BUILD-INFO.txt. SHA-256 tgz: $SUM"
          {
            echo '### Release ytdl'
            echo "- tag: \`$TAG\`"
            echo "- sha256 tgz: \`$SUM\`"
            echo "- ukuran tgz: \`$SIZE\` byte"
            echo "- Pin ke aplikasi dilakukan di langkah B2-2 (salin tag dan sha256 di atas)."
          } >> "$GITHUB_STEP_SUMMARY"
