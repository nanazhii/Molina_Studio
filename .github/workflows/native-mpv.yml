name: Native mpv (arm64)

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Abaikan cache dan bangun ulang dari nol"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prasyarat skrip dan pin
        run: |
          set -euo pipefail
          for f in scripts/native_mpv.sh scripts/native_wget.sh scripts/ensure_ndk.sh \
                   native/pins.env native/pins.sha256 native/git.pins \
                   third_party/mpv-build/buildall.sh third_party/mpv-build/include/depinfo.sh \
                   player/src/main/jni/Android.mk; do
            [ -s "$f" ] || { echo "::error::$f tidak ada atau kosong"; exit 1; }
          done
      - name: Cache hasil build (kunci = hash pin + skrip + sumber JNI)
        id: cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _mpv_out
          key: native-mpv-arm64-v1-${{ runner.os }}-${{ hashFiles('native/pins.env', 'native/pins.sha256', 'native/git.pins', 'scripts/native_mpv.sh', 'scripts/native_wget.sh', 'scripts/ensure_ndk.sh', 'third_party/mpv-build/**', 'player/src/main/jni/**') }}
      - name: Verifikasi hasil cache
        id: verify
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          ok=false
          if [ "$CACHE_HIT" = "true" ]; then
            if ( cd _mpv_out && test -s molina-mpv-arm64.tgz && test -s BUILD-INFO.txt && sha256sum -c SHA256SUMS ); then
              ok=true
              echo "Cache cocok dan utuh: build dilewati."
            else
              echo "::warning::Cache rusak atau tidak lengkap; build ulang."
              rm -rf _mpv_out
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Paket build
        if: steps.verify.outputs.ok != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm
          sudo pip3 install --break-system-packages meson
      - name: Bangun libmpv dan libplayer (arm64)
        if: steps.verify.outputs.ok != 'true'
        run: bash scripts/native_mpv.sh
      - name: Ringkasan hash
        if: success()
        run: |
          {
            echo '### SHA256SUMS'; echo '```'; cat _mpv_out/SHA256SUMS; echo '```'
            echo '### BUILD-INFO'; echo '```'; cat _mpv_out/BUILD-INFO.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: molina-mpv-arm64
          path: |
            _mpv_out/molina-mpv-arm64.tgz
            _mpv_out/SHA256SUMS
            _mpv_out/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: molina-mpv-arm64
          path: _dl
      - name: Terbitkan ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd _dl
          TAG="native-mpv-${GITHUB_SHA:0:7}-run${GITHUB_RUN_NUMBER}"
          SUM="$(sha256sum molina-mpv-arm64.tgz | cut -d' ' -f1)"
          grep -q "$SUM  molina-mpv-arm64.tgz" SHA256SUMS
          gh release create "$TAG" molina-mpv-arm64.tgz SHA256SUMS BUILD-INFO.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "mpv arm64 $TAG" \
            --notes "libmpv + libplayer arm64 hasil build pipeline Molina (versi dan commit sumber di BUILD-INFO.txt). SHA-256 tgz: $SUM"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SUM=$SUM" >> "$GITHUB_ENV"
          {
            echo '### Release mpv'
            echo "- tag: \`$TAG\`"
            echo "- sha256 tgz: \`$SUM\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pin Release ke native/mpv.pin.env (job APK memasang dari sini)
        run: |
          set -euo pipefail
          F=native/mpv.pin.env
          cat > "$F" <<EOF
          # Dihasilkan workflow "Native mpv (arm64)"; jangan edit manual.
          MPV_NATIVE_TAG=$TAG
          MPV_NATIVE_TGZ_SHA256=$SUM
          EOF
          python3 scripts/telemetry_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "chore(mpv): pin Release $TAG [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          if git push origin "HEAD:${{ github.ref_name }}"; then
            echo "- native/mpv.pin.env di-commit otomatis ke ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Push ditolak (branch terlindungi?). Salin isi native/mpv.pin.env dari log ke repo secara manual."
            cat "$F"
          fi
