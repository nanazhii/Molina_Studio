name: Build Molina Studio

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Varian build"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Gerbang telemetri dan URL
        if: hashFiles('scripts/telemetry_gate.py') != ''
        run: python3 scripts/telemetry_gate.py
      - name: Gerbang batas modul
        if: hashFiles('scripts/module_gate.py') != ''
        run: python3 scripts/module_gate.py
      - name: Gerbang rahasia
        if: hashFiles('scripts/secret_gate.py') != ''
        run: python3 scripts/secret_gate.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.10.2
      - name: Siapkan kunci tanda tangan tetap
        if: inputs.variant == 'release'
        env:
          MOLINA_KEYSTORE_B64: ${{ secrets.MOLINA_KEYSTORE_B64 }}
          MOLINA_KEYSTORE_PASSWORD: ${{ secrets.MOLINA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$MOLINA_KEYSTORE_B64" ] && [ -n "$MOLINA_KEYSTORE_PASSWORD" ]; then
            ( umask 077; printf %s "$MOLINA_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/molina.p12" )
            echo "MOLINA_KEYSTORE_FILE=$RUNNER_TEMP/molina.p12" >> "$GITHUB_ENV"
            echo "Kunci tetap dipakai."
          else
            echo "::error::Secret kunci belum diisi; build release dibatalkan."; exit 1
          fi
      - name: Verifikasi kunci tanda tangan (senyap)
        if: inputs.variant == 'release' && env.MOLINA_KEYSTORE_FILE != ''
        env:
          MOLINA_KEYSTORE_PASSWORD: ${{ secrets.MOLINA_KEYSTORE_PASSWORD }}
        run: |
          set +x
          f="$MOLINA_KEYSTORE_FILE"
          if ! keytool -list -storetype pkcs12 -keystore "$f" -storepass:env MOLINA_KEYSTORE_PASSWORD -alias molina >/dev/null 2>&1; then
            echo "::error::keystore tidak bisa dibuka atau alias molina tidak ada"; exit 1
          fi
          if ! openssl pkcs12 -in "$f" -nodes -passin env:MOLINA_KEYSTORE_PASSWORD 2>/dev/null | grep -q "PRIVATE KEY"; then
            echo "::error::kunci privat tidak terbaca (password tidak cocok atau berkas rusak)"; exit 1
          fi
          echo "Keystore valid."
      - name: Pustaka native mpv (terverifikasi SHA-256)
        if: hashFiles('scripts/fetch_native.sh') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_native.sh
      - name: Pastikan NDK sesuai pin
        if: hashFiles('scripts/ensure_ndk.sh') != ''
        run: bash scripts/ensure_ndk.sh
      - name: NDK dipin untuk modul native Gradle (terminal-pty)
        if: hashFiles('scripts/ensure_ndk.sh') != ''
        run: |
          bash scripts/ensure_ndk.sh --dest "$ANDROID_HOME/ndk"
          . native/pins.env
          ln -sfn "$ANDROID_HOME/ndk/android-ndk-$NDK_VERSION" "$ANDROID_HOME/ndk/$NDK_REVISION"
      - name: Build APK Molina
        env:
          MOLINA_KEYSTORE_PASSWORD: ${{ inputs.variant == 'release' && secrets.MOLINA_KEYSTORE_PASSWORD || '' }}
        run: gradle :app:assemble${VARIANT^} --stacktrace
      - name: Pastikan bukan debuggable
        if: inputs.variant == 'release'
        run: |
          A=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            if "$A" dump badging "$f" | grep -q "application-debuggable"; then
              echo "::error::$f masih debuggable"; exit 1
            fi
            echo "OK bukan debuggable: $f"
          done
      - name: Pastikan bertanda tangan kunci Molina dan cetak sidik jari
        if: inputs.variant == 'release'
        run: |
          A=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            if ! "$A" verify --print-certs "$f" > "$RUNNER_TEMP/cert.txt" 2>&1; then
              echo "::error::$f tidak bertanda tangan"; exit 1
            fi
            if grep -qi "Android Debug" "$RUNNER_TEMP/cert.txt"; then
              echo "::error::$f ditandatangani kunci debug"; exit 1
            fi
            grep -i "SHA-256" "$RUNNER_TEMP/cert.txt" || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: molina-${{ inputs.variant }}
          path: |
            app/build/outputs/apk/${{ inputs.variant }}/*.apk
            app/build/outputs/mapping/release/
      - name: Hapus kunci sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/molina.p12"
