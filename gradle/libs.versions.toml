[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
coroutines = "1.9.0"
junit = "4.13.2"
fragment = "1.8.5"
recyclerview = "1.3.2"
lifecycle = "2.8.7"
zip4j = "2.11.5"
commonsCompress = "1.27.1"
xz = "1.10"
exifinterface = "1.3.7" # 26k5g:e01
composeBom = "2024.12.01"
activityCompose = "1.9.3"
sora = "0.23.6"
media = "1.7.0" # molina-p12
preference = "1.2.1" # molina-p12

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commonsCompress" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" } # 26k5g:e02
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
sora-editor = { module = "io.github.Rosemoe.sora-editor:editor", version.ref = "sora" }
sora-language-textmate = { module = "io.github.Rosemoe.sora-editor:language-textmate", version.ref = "sora" }

androidx-media = { module = "androidx.media:media", version.ref = "media" } # molina-p12
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" } # molina-p12

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
